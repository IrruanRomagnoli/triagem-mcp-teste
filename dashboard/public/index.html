<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Triagem de issues</title>
<script>
  // Aplica o tema salvo antes de pintar, para não piscar
  try { var t = localStorage.getItem("tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --text: #1c2030; --muted: #6b7288; --line: #e4e7ef;
    --accent: #5b5bd6; --reply-bg: #f0f0ff; --reply-line: #c9c9f5;
    --bug: #d94b4b; --enhancement: #1f9d6b; --question: #c78a0b; --documentation: #2f7bd6;
    --shadow: 0 1px 2px rgba(20,24,40,.06), 0 6px 20px rgba(20,24,40,.05);
    color-scheme: light;
  }
  /* Escuro: automático (sistema) ou forçado pelo botão via data-theme */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1220; --card: #181c2e; --text: #e8eaf4; --muted: #8e95b0; --line: #262b44;
      --accent: #8b8bff; --reply-bg: #1f2340; --reply-line: #343a6b;
      --bug: #ff7b7b; --enhancement: #4fd1a0; --question: #f0b84a; --documentation: #6aa8ff;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1220; --card: #181c2e; --text: #e8eaf4; --muted: #8e95b0; --line: #262b44;
    --accent: #8b8bff; --reply-bg: #1f2340; --reply-line: #343a6b;
    --bug: #ff7b7b; --enhancement: #4fd1a0; --question: #f0b84a; --documentation: #6aa8ff;
    --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-wrap: anywhere; transition: background .2s, color .2s; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .theme { display: inline-flex; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px; }
  .theme button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .theme button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 600px) {
    .wrap { padding: 20px 16px 48px; }
    header h1 { font-size: 22px; }
    .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 18px 0; }
    .stat { padding: 12px; }
    .stat .n { font-size: 26px; }
    .filters { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; padding-bottom: 4px; }
    .chip { flex: none; }
    .card { padding: 14px; }
  }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 24px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .stat .n { font-size: 32px; font-weight: 700; line-height: 1.1; }
  .stat .l { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .stat .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .stat .bar i { display: block; height: 100%; border-radius: 3px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .num { color: var(--muted); font-weight: 600; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.3; }
  .body { margin: 0; color: var(--muted); font-size: 14px; }
  .meta { font-size: 12px; color: var(--muted); }
  .reply { background: var(--reply-bg); border: 1px solid var(--reply-line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .reply .who { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .reply a { color: var(--accent); text-decoration: none; }
  .reply a:hover { text-decoration: underline; }
  .reply code { background: color-mix(in srgb, var(--accent) 15%, transparent); padding: 1px 5px; border-radius: 4px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script src="/vendor/babel.js"></script>
<script type="text/babel" data-presets="react" src="/app.jsx"></script>
</body>
</html>
